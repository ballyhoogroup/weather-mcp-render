services:
  - type: web
    name: weather-mcp
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: AUTH_REQUIRED
        value: "false"
      - key: PUBLIC_BASE_URL
        value: https://weather-mcp-render-ss69.onrender.com
